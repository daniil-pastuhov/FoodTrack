// Types the Compose compiler cannot prove stable on its own, but which are.
//
// Why this file exists: :shared does not apply the Compose compiler plugin (it is a KMP module
// and pulling compose-runtime into it would be a large change for no benefit), so the compiler
// has no stability information for anything declared there and conservatively assumes unstable.
// Same for kotlinx.datetime.
//
// This matters more than it looks. Strong skipping (default since Kotlin 2.0.20) marks almost
// every composable "skippable" regardless, but an *unstable* parameter is compared by instance
// identity rather than by equals(). Every Room emission rebuilds these objects, so the identity
// check fails every time and the composable recomposes even though it is nominally skippable.
// Declaring them stable switches that comparison to equals(), which is what actually lets a
// card skip when its contents haven't changed.
//
// Everything listed here is an immutable data class of vals (or an enum), so treating it as
// stable is accurate, not a shortcut. Verify that remains true before adding to this list — a
// type declared stable here that is in fact mutable will render stale UI with no error.

// Domain models: PantryItem, ShoppingListEntry, CategoryPreference, ProductInfo, AppSettings,
// ExpiryStatus, SortOption, AppTheme, NotificationSettings.
com.foodtracker.model.*

// View-layer row models derived from those (PantryRow, ShoppingRow, CategoryRow) and the
// PantryUiState container itself.
com.foodtracker.viewmodel.*

// CalendarDay and the calendar grid helpers.
com.foodtracker.util.*

// kotlinx-datetime's LocalDate is an immutable value type over an epoch day. It was by far the
// most common unstable parameter type in the baseline report (14 of 32 occurrences).
kotlinx.datetime.LocalDate
