name: CodeQL

# Advanced setup rather than GitHub's default one: the default setup's autobuild can build neither
# app. Android fails on the missing debug keystore (see "Create a debug keystore" in ci.yml), and
# iOS needs the Xcode and xcodebuild invocation that ci.yml's iOS build uses. The build steps
# below mirror ci.yml's; keep the two in step.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest
          - language: java-kotlin
            build-mode: manual
            runner: ubuntu-latest
          # Same runner and Xcode as ci.yml's iOS build (see there for why Xcode 27.1).
          - language: swift
            build-mode: manual
            runner: xcode-27
    env:
      DEVELOPER_DIR: ${{ matrix.language == 'swift' && '/Applications/Xcode_27.1.app/Contents/Developer' || '' }}
    steps:
      - uses: actions/checkout@v7

      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v5
        with:
          # A cached build would skip the compilation CodeQL has to observe.
          cache-read-only: true
      - if: matrix.language == 'java-kotlin'
        name: Create a debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - if: matrix.language == 'swift'
        name: Restore Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ hashFiles('iosApp/FoodTracker.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-
      # CodeQL's macOS build tracer needs Rosetta 2 on Apple silicon, which the xcode-27 image
      # lacks: without it every process the traced build spawns fails with "Bad CPU type".
      - if: matrix.language == 'swift'
        name: Install Rosetta
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      # Resolved before tracing starts, so CodeQL only traces the app's own compilation.
      - if: matrix.language == 'swift'
        name: Resolve Swift packages
        run: |
          xcodebuild -project iosApp/FoodTracker.xcodeproj -scheme FoodTracker \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resolvePackageDependencies

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The Kotlin extractor only sees compilations that run in the traced process, hence no
      # Gradle or Kotlin daemon and no build cache.
      - if: matrix.language == 'java-kotlin'
        name: Build Android
        run: |
          ./gradlew --no-daemon --no-build-cache -Pkotlin.compiler.execution.strategy=in-process \
            :androidApp:assembleDebug

      - if: matrix.language == 'swift'
        name: Build iOS
        run: |
          xcodebuild -project iosApp/FoodTracker.xcodeproj -scheme FoodTracker \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
