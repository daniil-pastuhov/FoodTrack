name: CI

# Every push and pull request: Android and shared unit tests, an Android debug build, an iOS build,
# and the Cloud Functions lint and emulator tests, each only when its files changed (see the
# "changes" job), plus the UI screenshot diff on a pull request touching Android, and none where
# another run already built the same code:
# - a release/v* pull request from this repository (not a fork, whose pushes run nothing here): the
#   push run of the same commit builds it, and must, as the publish jobs need it;
# - the push of a pull request's merge commit to main: the pull request's runs built the merge (as
#   of its last push, so a main that moved in between goes unbuilt). A release PR's merge is still
#   built, because its pull request runs are the ones skipped above.
# A release/v* push builds both platforms whatever changed, except that the TestFlight archive
# stands in for the iOS build when it runs. macOS minutes cost ten times Linux ones, so anything
# that doesn't need a Mac runs on Linux.
#
# Release flow (scripts/release starts it; see "Releasing" in README.md):
# - Each push to a release/vX.Y.Z branch publishes a signed bundle to the Google Play internal
#   track and, with the IOS_PUBLISH repository variable set to "true", a build to the internal
#   TestFlight testers, both with the notes in release-notes/vX.Y.Z/.
# - Merging that branch's PR promotes the same Play build to closed testing (alpha) and applies
#   the Play store listing from store-listing/google-play/, sets the App Store listing and
#   screenshots from store-listing/app-store/ on the version and submits the newest TestFlight
#   build of it for App Store review, and tags vX.Y.Z.
# Main itself publishes nothing. The release jobs live in this workflow, not a separate one,
# because the Play version code is derived from this workflow's run number.
on:
  push:
    branches: [main, "release/v*"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled. Pushes are never cancelled, so an upload is never
  # cut off halfway, and neither is the run that promotes a merged release PR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  changes:
    name: Find what to build
    if: >-
      github.event.action != 'closed' &&
      !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v') &&
        github.event.pull_request.head.repo.full_name == github.repository) &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'Merge pull request #') &&
        !contains(github.event.head_commit.message, '/release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.decide.outputs.android }}
      ios: ${{ steps.decide.outputs.ios }}
      functions: ${{ steps.decide.outputs.functions }}
      scripts: ${{ steps.decide.outputs.scripts }}
    env:
      BUILD_ALL: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: env.BUILD_ALL != 'true'
        with:
          # Version.xcconfig holds the version of both apps; a change to this workflow builds both.
          filters: |
            android:
              - 'androidApp/**'
              - 'shared/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'macrobenchmark/**'
              - 'Version.xcconfig'
              - '.github/workflows/ci.yml'
            ios:
              - 'iosApp/**'
              - 'Version.xcconfig'
              - '.github/workflows/ci.yml'
            functions:
              - 'functions/**'
              - 'firebase.json'
              - 'firebase.local.json'
              # test/providerSwitches.test.ts checks the owner console's page, SDK copy and headers.
              - 'owner-console/**'
              - 'firestore.rules'
              - 'firestore.indexes.json'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
              - 'store-listing/**'
              # scripts/tests/test_translations.py checks both apps' translations.
              - 'androidApp/src/main/res/values*/strings.xml'
              - 'iosApp/FoodTracker/*.lproj/**'
              - 'iosApp/FoodTracker.xcodeproj/project.pbxproj'
              - '.github/workflows/ci.yml'
      - name: Decide
        id: decide
        env:
          ANDROID: ${{ env.BUILD_ALL == 'true' || steps.filter.outputs.android == 'true' }}
          # publish-testflight's archive compiles everything the simulator build does.
          IOS: >-
            ${{ (env.BUILD_ALL == 'true' || steps.filter.outputs.ios == 'true') &&
            !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v') &&
              vars.IOS_PUBLISH == 'true') }}
          FUNCTIONS: ${{ env.BUILD_ALL == 'true' || steps.filter.outputs.functions == 'true' }}
          SCRIPTS: ${{ env.BUILD_ALL == 'true' || steps.filter.outputs.scripts == 'true' }}
        run: |
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "ios=$IOS" >> "$GITHUB_OUTPUT"
          echo "functions=$FUNCTIONS" >> "$GITHUB_OUTPUT"
          echo "scripts=$SCRIPTS" >> "$GITHUB_OUTPUT"
          echo "Android: $ANDROID, iOS: $IOS, functions: $FUNCTIONS, scripts: $SCRIPTS"

  android:
    name: Android tests and build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      # androidApp's debug signing config uses the key alias "debug", and the Android Gradle
      # Plugin only generates a debug keystore by itself for its default alias, so a fresh runner
      # has none. A throwaway one is fine: nothing signed with it leaves the runner.
      - name: Create a debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      # :shared's commonTest runs on the JVM through its Android host-test target.
      - name: Unit tests and debug build
        run: ./gradlew :shared:testAndroidHostTest :androidApp:testDebugUnitTest :androidApp:assembleDebug
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            androidApp/build/reports/tests/
            shared/build/reports/tests/
          retention-days: 7

  # The UI screenshot diff (README "UI screenshot check"): which Android screenshots a pull request
  # changes, as one comment on it with the pictures. The committed baselines are recorded on macOS
  # and Robolectric renders slightly differently here, so they are never compared: the base (the
  # merge commit's first parent) is rendered with its own scripts/ui_check.sh --record, cached by
  # its commit and the runner image, and the head (the merge commit) is compared with those images
  # in Roborazzi's compare mode. A difference never fails the job; a crash or a build error does.
  # A base without the check (older than it) is reported as nothing to compare with. This job runs
  # the pull request's code with the read-only token; the comment job below, which writes, runs
  # only scripts/ui_diff.py, and never for a fork.
  ui-screenshots:
    name: UI screenshot diff
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      status: ${{ steps.compare.outputs.status }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its parents: the first one is the base it is compared with.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      # As in the android job.
      - name: Create a debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Find the base
        id: base
        run: |
          BASE=$(git rev-parse HEAD^1)
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          if git cat-file -e "$BASE:scripts/ui_check.sh" 2>/dev/null; then HAS=true; else HAS=false; fi
          echo "has-check=$HAS" >> "$GITHUB_OUTPUT"
          # Rendering can change with the runner image (fonts, JDK), so the cache is per image too.
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "Base $BASE, UI screenshot check: $HAS, runner image $ImageOS $ImageVersion"
      - name: Restore the base's screenshots
        id: cache
        if: steps.base.outputs.has-check == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ui-base
          key: ui-screenshots-${{ steps.base.outputs.image }}-${{ steps.base.outputs.sha }}
      - name: Render the base
        if: steps.base.outputs.has-check == 'true' && steps.cache.outputs.cache-hit != 'true'
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          git worktree add -q "$RUNNER_TEMP/base-src" "$BASE"
          if ! (cd "$RUNNER_TEMP/base-src" && scripts/ui_check.sh --record); then
            tail -n 80 "$RUNNER_TEMP/base-src/androidApp/build/ui-check.log"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ui-base"
          cp "$RUNNER_TEMP/base-src/androidApp/src/test/snapshots/images/"*.png "$RUNNER_TEMP/ui-base/"
          git worktree remove --force "$RUNNER_TEMP/base-src"
      - name: Render the head and compare
        id: compare
        env:
          BASE: ${{ steps.base.outputs.sha }}
          HAS_CHECK: ${{ steps.base.outputs.has-check }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$HAS_CHECK" != true ]; then
            python3 scripts/ui_diff.py no-base --out "$RUNNER_TEMP/ui-diff" --base "$BASE" --head "$HEAD_SHA"
            exit 0
          fi
          # The base's Linux images stand in for the committed baselines.
          rm -rf androidApp/src/test/snapshots/images
          mkdir -p androidApp/src/test/snapshots/images
          cp "$RUNNER_TEMP/ui-base/"*.png androidApp/src/test/snapshots/images/
          STATUS=0
          ./gradlew :androidApp:testDebugUnitTest \
            --tests "com.github.takahirom.roborazzi.RoborazziPreviewParameterizedTests" \
            --tests "com.foodtracker.android.screenshots.*" \
            -Proborazzi.test.compare=true --console=plain > "$RUNNER_TEMP/ui-head.log" 2>&1 || STATUS=$?
          if ! python3 scripts/ui_diff.py collect --results androidApp/build/test-results/roborazzi \
                 --test-xml androidApp/build/test-results/testDebugUnitTest \
                 --baselines "$RUNNER_TEMP/ui-base" --out "$RUNNER_TEMP/ui-diff" \
                 --base "$BASE" --head "$HEAD_SHA" --gradle-status "$STATUS"; then
            tail -n 80 "$RUNNER_TEMP/ui-head.log"
            exit 1
          fi
      - name: Keep the diff
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshot-diff
          path: ${{ runner.temp }}/ui-diff
          if-no-files-found: error
          retention-days: 14
      - name: Job summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python3 scripts/ui_diff.py summary --manifest "$RUNNER_TEMP/ui-diff/manifest.json" \
            --artifact-url "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  # Puts the diff on the pull request (scripts/ui_diff.py publish): the images on the
  # screenshot-diffs branch under pr-<n>/<head sha>/ (the next push and the pull request's closing
  # remove them), one comment updated in place, and no comment while there never was a difference.
  # A fork's pull request has a read-only token, so it gets the artifact and the job summary only.
  # A push made with this token starts no workflow run, and this workflow's push trigger doesn't
  # cover screenshot-diffs anyway.
  # It also runs when a push leaves the pull request without Android changes (the diff job is then
  # skipped), so that a comment from an earlier push doesn't stay up.
  ui-screenshots-comment:
    name: UI screenshot diff comment
    needs: [changes, ui-screenshots]
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.result == 'success' &&
      (needs.ui-screenshots.result == 'success' ||
       (needs.ui-screenshots.result == 'skipped' && needs.changes.outputs.android != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ui_diff.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v7
        if: needs.ui-screenshots.result == 'success'
        with:
          name: ui-screenshot-diff
          path: ${{ runner.temp }}/ui-diff
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DIFFED: ${{ needs.ui-screenshots.result == 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ needs.ui-screenshots.outputs.artifact-url }}
        run: |
          if [ "$DIFFED" = true ]; then
            WHAT=(--manifest "$RUNNER_TEMP/ui-diff/manifest.json" --artifact-url "$ARTIFACT_URL")
          else
            WHAT=(--no-android --head "$HEAD_SHA")
          fi
          python3 scripts/ui_diff.py publish "${WHAT[@]}" \
            --repo "$GITHUB_REPOSITORY" --pr "$PR" --run-url "$RUN_URL"

  # A closed pull request's images leave the screenshot-diffs branch (its history keeps them, so
  # the comment's pinned links still load). Plain git, no checkout of the pull request's code.
  ui-screenshots-cleanup:
    name: Remove the pull request's UI screenshot diff images
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Remove pr-<n>/ from the screenshot-diffs branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git init -q diffs && cd diffs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          URL="https://github.com/$GITHUB_REPOSITORY"
          for attempt in 1 2 3 4 5; do
            git -c http.extraheader="$AUTH" fetch -q --depth 1 "$URL" screenshot-diffs \
              || { echo "No screenshot-diffs branch"; exit 0; }
            git checkout -q -f -B screenshot-diffs FETCH_HEAD
            [ -d "pr-$PR" ] || { echo "No images of #$PR"; exit 0; }
            git rm -rq "pr-$PR"
            git commit -qm "PR #$PR: closed"
            git -c http.extraheader="$AUTH" push -q "$URL" HEAD:refs/heads/screenshot-diffs && exit 0
            echo "Push refused (attempt $attempt); fetching again"
          done
          exit 1

  # Cloud Functions (functions/): lint, typecheck, build, and the tests against the Firestore and
  # Auth emulators, which need Java. Stores and the LLM are faked, and the demo- project id keeps
  # the emulators from reaching any real Firebase project. Nothing here deploys.
  functions:
    name: Functions lint and tests
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache the emulator binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('functions/package-lock.json') }}
          restore-keys: firebase-emulators-
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # The store texts' limits, and the unit tests of the store-listing sync (scripts/tests/, a fake
  # App Store Connect and Play; no network, no secrets, standard library only).
  scripts:
    name: Store listing checks and script tests
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_store_listing.py
      - run: python -m unittest discover -s scripts/tests

  ios:
    name: iOS build
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # Xcode 27.1 (the iOS 27.1 SDK) is what lets the app fill iPhone Duo's inner display; with
    # an older SDK it is kept to a smaller region. macos-latest only has Xcode 26, so the Xcode 27
    # image is used, with 27.1 picked over its default 27.0.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The Swift packages (Firebase above all) are slow to clone afresh on every run.
      - name: Restore Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ hashFiles('iosApp/FoodTracker.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-
      # A generic simulator destination builds every simulator architecture; arm64 is enough to
      # catch a compile error.
      - name: Build iOS app
        run: |
          xcodebuild -project iosApp/FoodTracker.xcodeproj -scheme FoodTracker \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

  publish-play:
    name: Publish to Google Play (internal)
    needs: android
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: play-publish
      cancel-in-progress: false
    env:
      # "completed" rolls each build out to the track's testers; the repository variable
      # PLAY_RELEASE_STATUS can set "draft" to leave the rollout to Play Console instead.
      PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the release version
        run: scripts/check_release_version.sh "${GITHUB_REF_NAME#release/v}"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > androidApp/release-keystore.jks
          # Read by androidApp/build.gradle.kts with java.util.Properties, which treats "\" as an
          # escape and drops leading spaces: escape both so a password reads back exactly.
          prop() { local v=${1//\\/\\\\}; [[ $v == " "* ]] && v="\\$v"; printf '%s' "$v"; }
          # storeFile is relative to androidApp/.
          printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$(prop "$KEYSTORE_PASSWORD")" "$(prop "$KEY_ALIAS")" "$(prop "$KEY_PASSWORD")" \
            > androidApp/keystore.properties
      - name: Build signed bundle
        # Past the codes uploaded by hand (5 and 6), and unique per re-run attempt too: Play
        # refuses a version code it has already accepted.
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
          ./gradlew :androidApp:bundleRelease -PversionCode=$((100 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Installed in its own step so the Play key is not in the environment while pip runs.
      - name: Install upload dependencies
        run: pip install --quiet google-api-python-client google-auth-httplib2
      - name: Upload to the internal track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/play_upload.py \
            --aab androidApp/build/outputs/bundle/release/androidApp-release.aab \
            --mapping androidApp/build/outputs/mapping/release/mapping.txt \
            --track internal \
            --status "$PLAY_RELEASE_STATUS" \
            --release-notes-dir "release-notes/v$RELEASE_VERSION" \
            --release-name "$RELEASE_VERSION ($VERSION_CODE)"
      - name: Keep the bundle
        uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ github.run_number }}
          path: |
            androidApp/build/outputs/bundle/release/androidApp-release.aab
            androidApp/build/outputs/mapping/release/mapping.txt
          retention-days: 14

  publish-testflight:
    name: Publish to TestFlight (internal)
    # No "needs: ios": the archive compiles everything that build would, so it is skipped here.
    # Needs the repository variable IOS_PUBLISH set to "true" and the ASC_* secrets (see
    # store-listing/app-store/README.md).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v') && vars.IOS_PUBLISH == 'true'
    # Same Xcode as the iOS build job, for iPhone Duo (see there).
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: 45
    concurrency:
      group: testflight-publish
      cancel-in-progress: false
    outputs:
      build-number: ${{ steps.upload.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the release version
        run: scripts/check_release_version.sh "${GITHUB_REF_NAME#release/v}"
      - name: Restore the App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_P8_BASE64" ]; then echo "::error::Missing secret ASC_KEY_P8_BASE64"; exit 1; fi
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install App Store Connect API dependencies
        run: pip install --quiet cryptography
      # Each archive leaves an Apple Development certificate behind (see testflight.py).
      - name: Revoke certificates left by earlier runs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" python scripts/testflight.py revoke-ci-certs
      - name: Archive and upload
        id: upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Chosen here rather than inside ios_release.sh so the next job knows which build to wait for.
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          BUILD_NUMBER=$BUILD_NUMBER ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" scripts/ios_release.sh

  # Waiting for App Store Connect to process the upload needs no Mac, so it doesn't hold one.
  testflight-notes:
    name: Hand the TestFlight build to internal testers
    needs: publish-testflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: testflight-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Restore the App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install App Store Connect API dependencies
        run: pip install --quiet cryptography
      - name: Set What to Test and hand the build to internal testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ needs.publish-testflight.outputs.build-number }}
        run: |
          VERSION=${GITHUB_REF_NAME#release/v}
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" python scripts/testflight.py notes \
            --version "$VERSION" --build "$BUILD_NUMBER" --notes-dir "release-notes/v$VERSION"

  # --- Merged release PR: move the tested builds on to Play closed testing and the App Store ----

  promote-play:
    name: Promote to Google Play closed testing
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.merged && startsWith(github.head_ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: play-publish
      cancel-in-progress: false
    env:
      PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Check the release version
        run: scripts/check_release_version.sh "${GITHUB_HEAD_REF#release/v}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install upload dependencies
        run: pip install --quiet google-api-python-client google-auth-httplib2
      # The newest internal release of this version is the build testers have been trying; it is
      # promoted as is rather than rebuilt from the merge commit.
      - name: Promote internal to closed testing
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/play_upload.py \
            --promote-from internal --version "$RELEASE_VERSION" \
            --track alpha \
            --status "$PLAY_RELEASE_STATUS" \
            --release-notes-dir "release-notes/v$RELEASE_VERSION"

  # The store listing goes out with the release whose features it describes: after the promotion
  # and in its own edit and job, so a listing problem neither holds back the build nor the tag.
  # Re-running it is safe: it writes only what still differs from store-listing/google-play/.
  play-listing:
    name: Update the Google Play store listing
    needs: promote-play
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: play-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install upload dependencies
        run: pip install --quiet google-api-python-client google-auth-httplib2
      - name: Apply the texts and images from store-listing/google-play/
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python scripts/play_listing.py --images --apply

  # The upload and the wait for its processing are separate jobs, so the testflight-publish group
  # alone could let release-app-store run between them and submit an older build. This waits for
  # the release branch's runs to finish first, outside that group: inside it, it would hold the
  # group that the run it waits for still needs.
  wait-for-testflight:
    name: Wait for the release branch's TestFlight upload
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.merged && startsWith(github.head_ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.IOS_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
    steps:
      - name: Wait for the release branch's runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while [ -n "$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$GITHUB_HEAD_REF" \
                       --event push --json status --jq '.[] | select(.status != "completed") | .status')" ]; do
            echo "A $GITHUB_HEAD_REF run is still going; checking again in 30 s"
            sleep 30
          done

  release-app-store:
    name: Submit to the App Store
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.merged && startsWith(github.head_ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.IOS_PUBLISH == 'true'
    needs: wait-for-testflight
    runs-on: ubuntu-latest
    # Uploading and processing the screenshot sets takes most of it.
    timeout-minutes: 45
    concurrency:
      group: testflight-publish
      cancel-in-progress: false
    env:
      # "AFTER_APPROVAL" goes live as soon as App Review approves; the repository variable
      # APP_STORE_RELEASE_TYPE can set "MANUAL" to release it from App Store Connect instead.
      APP_STORE_RELEASE_TYPE: ${{ vars.APP_STORE_RELEASE_TYPE || 'AFTER_APPROVAL' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Check the release version
        run: scripts/check_release_version.sh "${GITHUB_HEAD_REF#release/v}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install App Store Connect API dependencies
        run: pip install --quiet cryptography
      # Sets the listing and the screenshot sets from store-listing/app-store/ before submitting;
      # if either fails, nothing is submitted and a re-run continues where it stopped.
      - name: Submit the newest build for App Review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" python scripts/testflight.py appstore \
            --version "$RELEASE_VERSION" --notes-dir "release-notes/v$RELEASE_VERSION" \
            --release-type "$APP_STORE_RELEASE_TYPE" --screenshots

  tag-release:
    name: Tag the release
    needs: [promote-play, release-app-store]
    # Tagged once Play has the release; an App Store failure is reported by its own job and can be
    # re-run without moving the tag that scripts/release counts the next release's commits from.
    if: ${{ !cancelled() && needs.promote-play.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Tag and create a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          VERSION=${GITHUB_HEAD_REF#release/v}
          gh release create "v$VERSION" --target "$MERGE_SHA" --title "$VERSION" \
            --notes-file "release-notes/v$VERSION/en-GB.txt"
